# .github/workflows/release.yml
# Build + Release: ad ogni tag v* (es. v0.2.0) compila l'installer Windows (NSIS)
# e lo pubblica come GitHub Release scaricabile.
#
# Flusso di rilascio (locale):
#   npm test
#   npm run release:minor   # aggiorna la versione, commit, tag vX.Y.Z e push
# La Action fa il resto: build Tauri su windows-latest e upload degli asset.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check tag matches manifest version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $cargoVer = $cargo.Matches.Groups[1].Value
          $expected = "v$($pkg.version)"
          if ("${{ github.ref_name }}" -ne $expected) { throw "Tag ${{ github.ref_name }} non coincide con package.json ($expected). Usa tools/bump-version.mjs per versionare." }
          if ($tauri.version -ne $pkg.version) { throw "tauri.conf.json ($($tauri.version)) disallineato da package.json ($($pkg.version))." }
          if ($cargoVer -ne $pkg.version) { throw "Cargo.toml ($cargoVer) disallineato da package.json ($($pkg.version))." }
          Write-Host "Versioni allineate: $($pkg.version)"

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DSH Desktop Manager ${{ github.ref_name }}"
          releaseBody: "Installer Windows (NSIS) negli asset qui sotto, con SHA256SUMS.txt per verificarne l'integrita'. Dettagli nel CHANGELOG.md. Nota: l'installer non e' firmato (Authenticode), quindi SmartScreen puo' mostrare 'editore sconosciuto': Ulteriori informazioni -> Esegui comunque."
          releaseDraft: false
          # I tag con suffisso (es. v0.2.0-rc.1) diventano pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Gli asset caricati da tauri-action sono i file in
      # src-tauri/target/release/bundle: li firmiamo con l'hash SHA256 e
      # alleghiamo SHA256SUMS.txt alla stessa Release, cosi' chi scarica
      # puo' verificare che l'installer non sia stato alterato.
      - name: Publish SHA256 checksums
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $artifacts = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.msi' -or $_.Name -like '*.zip' }
          if (-not $artifacts) { throw 'Nessun artefatto trovato in src-tauri/target/release/bundle.' }
          $lines = foreach ($f in $artifacts) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding Ascii
          Get-Content SHA256SUMS.txt
          gh release upload ${{ github.ref_name }} SHA256SUMS.txt --clobber
