[package]
name = "dsh-desktop-manager"
version = "0.1.0"
description = "Gestore desktop per DeepSeek Harness (DSH)"
authors = ["j.magarelli"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
